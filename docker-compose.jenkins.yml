
services:
  jenkins:
    build:
      context: ./jenkins
    container_name: cloudforge-jenkins
    restart: unless-stopped
    depends_on:
      ci-redis:
        condition: service_healthy
    ports:
      - "127.0.0.1:8081:8080"
    group_add:
      - "${DOCKER_GID:?Set DOCKER_GID before starting Jenkins}"
    volumes:
      - jenkins-home:/var/jenkins_home
      - /var/run/docker.sock:/var/run/docker.sock
    healthcheck:
      test:
        - CMD
        - curl
        - -fsS
        - http://127.0.0.1:8080/login
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 90s

  ci-redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

volumes:
  jenkins-home:

